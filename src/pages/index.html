<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Leret — Model and Commercial Intelligence Specialist, Manchester</title>
  <meta name="description" content="Leret: a model with Brother Models and a commercial intelligence specialist building AI automation for commercial teams. Based in Manchester, UK.">
  <link rel="icon" href="/images/lm-logo.svg" type="image/svg+xml">
  <link rel="stylesheet" href="/style.css">
</head>
<body class="home-page">
<!-- NAV -->

<!-- HOMEPAGE: the shared left column comes from partials/nav.html; this
     page's own content (the photo wall) fills the right side. -->
<main class="split__photos">
  <h1 class="sr-only">Leret</h1>
  <!-- PHOTOS: click any to see it larger. Add new photos here as more
       <button class="gallery__item"> blocks (newest shoots first). -->
  <section aria-label="Photos of Leret">
    <div class="photo-wall">
      <button class="gallery__item" type="button">
        <img src="/images/headshots/17-leret-polaroids-brother-models.jpg" data-full="/images/headshots/17-leret-polaroids-brother-models.jpg" alt="Leret, full length, black vest top and jeans" fetchpriority="high">
      </button>
      <button class="gallery__item" type="button">
        <img src="/images/headshots/9-leret-polaroids-brother-models.jpg" data-full="/images/headshots/9-leret-polaroids-brother-models.jpg" alt="Leret, close-up, smiling" fetchpriority="high">
      </button>
      <button class="gallery__item" type="button">
        <img src="/images/headshots/1-leret-polaroids-brother-models.jpg" data-full="/images/headshots/1-leret-polaroids-brother-models.jpg" alt="Leret, close-up, front-on" fetchpriority="high">
      </button>
      <button class="gallery__item" type="button">
        <img src="/images/headshots/10-leret-polaroids-brother-models.jpg" data-full="/images/headshots/10-leret-polaroids-brother-models.jpg" alt="Leret, side profile" fetchpriority="high">
      </button>
      <button class="gallery__item" type="button">
        <img src="/images/headshots/2-leret-polaroids-brother-models.jpg" data-full="/images/headshots/2-leret-polaroids-brother-models.jpg" alt="Leret, waist up, black vest top and jeans" loading="lazy">
      </button>
      <button class="gallery__item" type="button">
        <img src="/images/headshots/12-leret-polaroids-brother-models.jpg" data-full="/images/headshots/12-leret-polaroids-brother-models.jpg" alt="Leret, looking back over the shoulder" loading="lazy">
      </button>
      <button class="gallery__item" type="button">
        <img src="/images/headshots/3-leret-polaroids-brother-models.jpg" data-full="/images/headshots/3-leret-polaroids-brother-models.jpg" alt="Leret, head slightly tilted" loading="lazy">
      </button>
      <button class="gallery__item" type="button">
        <img src="/images/headshots/14-leret-polaroids-brother-models.jpg" data-full="/images/headshots/14-leret-polaroids-brother-models.jpg" alt="Leret, side profile, waist up" loading="lazy">
      </button>
      <button class="gallery__item" type="button">
        <img src="/images/headshots/6-leret-polaroids-brother-models.jpg" data-full="/images/headshots/6-leret-polaroids-brother-models.jpg" alt="Leret, head tilted, shoulders angled" loading="lazy">
      </button>
      <button class="gallery__item" type="button">
        <img src="/images/headshots/11-leret-polaroids-brother-models.jpg" data-full="/images/headshots/11-leret-polaroids-brother-models.jpg" alt="Leret, three-quarter view" loading="lazy">
      </button>
      <button class="gallery__item" type="button">
        <img src="/images/headshots/4-leret-polaroids-brother-models.jpg" data-full="/images/headshots/4-leret-polaroids-brother-models.jpg" alt="Leret, waist up, hands at the waist" loading="lazy">
      </button>
      <button class="gallery__item" type="button">
        <img src="/images/headshots/8-leret-polaroids-brother-models.jpg" data-full="/images/headshots/8-leret-polaroids-brother-models.jpg" alt="Leret, close-up, neutral expression" loading="lazy">
      </button>
      <button class="gallery__item" type="button">
        <img src="/images/headshots/15-leret-polaroids-brother-models.jpg" data-full="/images/headshots/15-leret-polaroids-brother-models.jpg" alt="Leret, side-on, facing the camera" loading="lazy">
      </button>
      <button class="gallery__item" type="button">
        <img src="/images/headshots/7-leret-polaroids-brother-models.jpg" data-full="/images/headshots/7-leret-polaroids-brother-models.jpg" alt="Leret, waist up, arms by the sides" loading="lazy">

      <button class="gallery__item" type="button">
        <img src="/images/headshots/13-leret-polaroids-brother-models.jpg" data-full="/images/headshots/13-leret-polaroids-brother-models.jpg" alt="Leret, side-on, looking at the camera" loading="lazy">
      </button>
      <button class="gallery__item" type="button">
        <img src="/images/headshots/5-leret-polaroids-brother-models.jpg" data-full="/images/headshots/5-leret-polaroids-brother-models.jpg" alt="Leret, waist up, front-on" loading="lazy">
      </button>
      <button class="gallery__item" type="button">
        <img src="/images/headshots/16-leret-polaroids-brother-models.jpg" data-full="/images/headshots/16-leret-polaroids-brother-models.jpg" alt="Leret, side profile, facing left" loading="lazy">
      </button>
    </div>
    <p class="photo-credit">Polaroids: Brother Models</p>

</main>

<div class="lightbox" id="lightbox" hidden>
  <button class="lightbox__close" aria-label="Close">&times;</button>
  <img id="lightboxImage" src="" alt="">
  <p class="lightbox__caption" id="lightboxCaption"></p>
</div>

<!-- FOOTER -->
<script src="/script.js"></script>
</body>
