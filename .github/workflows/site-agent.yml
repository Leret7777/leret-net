# The leret.me site agent.
#
# Every morning GitHub starts a fresh machine, hands this repository to
# Claude with the standing job description in agent/BRIEF.md, runs a
# safety check on whatever Claude changed, and publishes it.
#
# Needs one secret: ANTHROPIC_API_KEY (Settings → Secrets and variables
# → Actions). To run it straight away: Actions tab → "Site agent" →
# "Run workflow".

name: Site agent

on:
  schedule:
    # 06:17 UTC daily = 07:17 in UK summer, 06:17 in winter.
    - cron: "17 6 * * *"
  workflow_dispatch:
    inputs:
      feeds_only:
        description: "Only test fetching Substack and YouTube (no agent, no changes)"
        type: boolean
        default: false

permissions:
  contents: write   # commit and push the day's changes
  pages: write      # ask GitHub Pages to republish the site
  issues: write     # post the daily report

# Never let two runs overlap.
concurrency:
  group: site-agent
  cancel-in-progress: false

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - name: Get the site
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install the photo resizer's one dependency
        run: pip install Pillow

      # The agent's own web tool is turned away by Substack and YouTube, so
      # the feeds are downloaded here with a normal browser identity and
      # saved to .feeds/ (not committed) for the agent to read.
      - name: Fetch Leret's Substack and YouTube feeds
        run: |
          mkdir -p .feeds
          UA="Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/124.0 Safari/537.36"
          get() {  # get <output file> <url>...  (tries each url until one works)
            out="$1"; shift
            for url in "$@"; do
              code=$(curl -sL -A "$UA" -H "Accept: application/rss+xml, application/xml, application/json, text/xml, */*" \
                     --max-time 30 -o "$out" -w '%{http_code}' "$url" || echo 000)
              if [ "$code" = "200" ] && [ -s "$out" ]; then
                echo "OK   $(basename "$out")  from $url" | tee -a .feeds/status.txt
                return 0
              fi
              echo "     $(basename "$out")  $url gave $code" | tee -a .feeds/status.txt
            done
            rm -f "$out"
            echo "FAIL $(basename "$out")  (all addresses refused)" | tee -a .feeds/status.txt
          }
          get .feeds/substack.xml \
            "https://leret1.substack.com/feed" \
            "https://substack.com/@leret1/feed"
          get .feeds/substack-archive.json \
            "https://leret1.substack.com/api/v1/archive?sort=new&limit=20"
          get .feeds/youtube.xml \
            "https://www.youtube.com/feeds/videos.xml?channel_id=UCpwLhWwcZxG0T-opIfukH5A"
          echo "--- what was saved"; ls -la .feeds
          for f in .feeds/substack.xml .feeds/youtube.xml; do
            [ -f "$f" ] && echo "$(basename "$f") items: $(grep -c -E '<item>|<entry>' "$f")" | tee -a .feeds/status.txt
          done
          # Show the result on the run's summary page as well.
          while read -r line; do echo "::notice title=Feeds::$line"; done < .feeds/status.txt
          true

      - name: Remember where we started
        if: ${{ !inputs.feeds_only }}
        id: base
        run: echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"

      - name: Run the agent
        if: ${{ !inputs.feeds_only }}
        uses: anthropics/claude-code-action@v1
        with:
          anthropic_api_key: ${{ secrets.ANTHROPIC_API_KEY }}
          github_token: ${{ secrets.GITHUB_TOKEN }}
          prompt: |
            This is today's scheduled run of the leret.me site agent.
            Today's date: use `date +%F`.
            Read agent/BRIEF.md and follow it exactly. Nobody is available
            to answer questions; decide and log what you did.
          claude_args: |
            --model claude-sonnet-5-5
            --max-turns 60
            --allowedTools "Read,Write,Edit,Glob,Grep,WebFetch,Bash(python3 build.py),Bash(python3 agent/check_site.py:*),Bash(python3 scripts/resize_images.py:*),Bash(git status:*),Bash(git diff:*),Bash(git log:*),Bash(git mv:*),Bash(git rm:*),Bash(mkdir:*),Bash(ls:*),Bash(date:*)"

      - name: Safety check (undo anything out of bounds, make sure the site builds)
        if: ${{ !inputs.feeds_only }}
        run: python3 agent/guard.py "${{ steps.base.outputs.sha }}"

      - name: Publish
        if: ${{ !inputs.feeds_only }}
        id: publish
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          git config user.name "leret.me site agent"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "Nothing changed today."
            echo "sha=" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          git commit -m "Site agent: daily update $(date -u +%F)"
          git push origin HEAD:main
          echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"
          # Pushes made by a workflow don't always trigger a Pages rebuild,
          # so ask for one explicitly.
          gh api -X POST "repos/${{ github.repository }}/pages/builds" || echo "Pages rebuild request failed; it will still publish on the next push."

      # The daily report: a GitHub issue, so you get a notification on your
      # phone/email saying what changed, with links, and can reply "undo".
      # Older reports are closed so only today's is open.
      - name: Post today's report
        if: always() && steps.base.outputs.sha != ''
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          AGENT_OK: ${{ steps.publish.outcome }}
        run: |
          gh label create site-agent --color 3a6d4a --description "Daily site agent report" --force >/dev/null 2>&1 || true
          for n in $(gh issue list --label site-agent --state open --json number -q '.[].number'); do
            gh issue close "$n" >/dev/null
          done
          if [ "$AGENT_OK" = "success" ]; then
            python3 agent/report.py "${{ steps.base.outputs.sha }}" "${{ steps.publish.outputs.sha }}" > report.md
          else
            {
              echo "**Today's run stopped before publishing, so nothing on the site changed.**"
              echo
              echo "The safety check or the agent hit a problem. Details are in the run log:"
              echo "${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"
              echo
              echo "Nothing for you to do; it tries again tomorrow."
            } > report.md
          fi
          gh issue create --label site-agent --title "Site agent report: $(date -u '+%-d %b %Y')" --body-file report.md
